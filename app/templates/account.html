{% extends "base.html" %}
{% block title %}Account — BlockSmithy{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-10 px-4 pb-16">
  <h1 class="text-2xl font-bold text-gray-900 mb-8">Account Settings</h1>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
    <h2 class="font-semibold text-gray-800 mb-4">Change Email</h2>
    <form id="email-form" class="space-y-3">
      <div>
        <label for="new-email" class="block text-sm font-medium text-gray-600 mb-1">New Email</label>
        <input type="email" id="new-email" value="{{ current_user.email }}" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none text-sm">
      </div>
      <div>
        <label for="email-password" class="block text-sm font-medium text-gray-600 mb-1">Current Password</label>
        <input type="password" id="email-password" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none text-sm">
      </div>
      <p id="email-status" class="text-sm hidden"></p>
      <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
        Update Email
      </button>
    </form>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
    <h2 class="font-semibold text-gray-800 mb-4">Change Password</h2>
    <form id="password-form" class="space-y-3">
      <div>
        <label for="current-password" class="block text-sm font-medium text-gray-600 mb-1">Current Password</label>
        <input type="password" id="current-password" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none text-sm">
      </div>
      <div>
        <label for="new-password" class="block text-sm font-medium text-gray-600 mb-1">New Password</label>
        <input type="password" id="new-password" required minlength="6"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none text-sm">
      </div>
      <p id="password-status" class="text-sm hidden"></p>
      <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
        Update Password
      </button>
    </form>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <h2 class="font-semibold text-gray-800 mb-4">Theme</h2>
    <div class="flex flex-col sm:flex-row gap-3">
      <button data-theme="light"
              class="theme-btn flex-1 border-2 rounded-lg px-4 py-3 text-sm font-medium text-center transition
                     {% if current_user.theme == 'light' %}border-indigo-500 bg-indigo-50 text-indigo-700{% else %}border-gray-200 text-gray-600 hover:border-gray-300{% endif %}">
        <span class="block text-lg mb-1">☀️</span>
        Light
      </button>
      <button data-theme="dark-light"
              class="theme-btn flex-1 border-2 rounded-lg px-4 py-3 text-sm font-medium text-center transition
                     {% if current_user.theme == 'dark-light' %}border-indigo-500 bg-indigo-50 text-indigo-700{% else %}border-gray-200 text-gray-600 hover:border-gray-300{% endif %}">
        <span class="block text-lg mb-1">🌓</span>
        Dark-Light
      </button>
      <button data-theme="dark"
              class="theme-btn flex-1 border-2 rounded-lg px-4 py-3 text-sm font-medium text-center transition
                     {% if current_user.theme == 'dark' %}border-indigo-500 bg-indigo-50 text-indigo-700{% else %}border-gray-200 text-gray-600 hover:border-gray-300{% endif %}">
        <span class="block text-lg mb-1">🌙</span>
        Dark
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  const cs = document.getElementById('new-email');
  const es = document.getElementById('email-status');
  document.getElementById('email-form').addEventListener('submit', function (e) {
    e.preventDefault();
    fetch('/api/account/email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: cs.value, password: document.getElementById('email-password').value })
    }).then(function (r) { return r.json().then(function (d) { d.status = r.status; return d; }); }).then(function (d) {
      es.classList.remove('hidden', 'text-green-600', 'text-red-600');
      if (d.ok) {
        es.textContent = 'Email updated successfully.';
        es.classList.add('text-green-600');
      } else {
        es.textContent = d.error || 'Something went wrong.';
        es.classList.add('text-red-600');
      }
    });
  });

  const ps = document.getElementById('password-status');
  document.getElementById('password-form').addEventListener('submit', function (e) {
    e.preventDefault();
    fetch('/api/account/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        current_password: document.getElementById('current-password').value,
        new_password: document.getElementById('new-password').value
      })
    }).then(function (r) { return r.json().then(function (d) { d.status = r.status; return d; }); }).then(function (d) {
      ps.classList.remove('hidden', 'text-green-600', 'text-red-600');
      if (d.ok) {
        ps.textContent = 'Password updated successfully.';
        ps.classList.add('text-green-600');
        document.getElementById('current-password').value = '';
        document.getElementById('new-password').value = '';
      } else {
        ps.textContent = d.error || 'Something went wrong.';
        ps.classList.add('text-red-600');
      }
    });
  });

  document.querySelectorAll('.theme-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var theme = btn.dataset.theme;
      fetch('/api/account/theme', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ theme: theme })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) {
          document.querySelectorAll('.theme-btn').forEach(function (b) {
            b.className = b.className.replace(/border-(indigo-500|gray-200) bg-(indigo-50|white) text-(indigo-700|gray-600)/g, '');
            b.classList.add('border-gray-200', 'text-gray-600', 'hover:border-gray-300');
          });
          btn.classList.remove('border-gray-200', 'text-gray-600', 'hover:border-gray-300');
          btn.classList.add('border-indigo-500', 'bg-indigo-50', 'text-indigo-700');
          document.documentElement.className = 'theme-' + theme;
          localStorage.setItem('blocksmithy-theme', theme);
        }
      });
    });
  });
})();
</script>
{% endblock %}
