{% extends "base.html" %}
{% block title %}Login — BlockSmithy{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 px-4">
  <div class="rounded-xl shadow-md p-8" style="background: var(--bg-card);">
    <h1 class="text-2xl font-bold text-center mb-6" style="color: var(--text);">Welcome to BlockSmithy</h1>
    <p class="text-sm text-center mb-6" style="color: var(--text-secondary);">Sign in or create an account to start building prompts.</p>
    <form method="POST" action="{{ url_for('main.login') }}" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium mb-1" style="color: var(--text);">Email</label>
        <input type="email" name="email" id="email" required
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none"
               style="border-color: var(--border); background: var(--bg); color: var(--text);">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium mb-1" style="color: var(--text);">Password</label>
        <input type="password" name="password" id="password" required minlength="6"
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none"
               style="border-color: var(--border); background: var(--bg); color: var(--text);">
      </div>
      <button type="submit" class="w-full text-white py-2 rounded-lg font-medium transition" style="background: var(--accent);">Sign In</button>
    </form>
    <div class="mt-4 pt-4 border-t" style="border-color: var(--border);">
      <p class="text-sm text-center mb-3" style="color: var(--text-secondary);">Don't have an account?</p>
      <form method="POST" action="{{ url_for('main.signup') }}" class="space-y-4">
        <input type="email" name="email" placeholder="Email" required
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none"
               style="border-color: var(--border); background: var(--bg); color: var(--text);">
        <input type="password" name="password" placeholder="Password (min 6 chars)" required minlength="6"
               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none"
               style="border-color: var(--border); background: var(--bg); color: var(--text);">
        <button type="submit" class="w-full text-white py-2 rounded-lg font-medium transition" style="background: #1f2937;">Create Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
