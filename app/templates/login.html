{% extends "base.html" %}
{% block title %}Login — BlockSmithy{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 px-4">
  <div class="bg-white rounded-xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-center mb-6">Welcome to BlockSmithy</h1>
    <p class="text-gray-500 text-sm text-center mb-6">Sign in or create an account to start building prompts.</p>
    <form method="POST" action="{{ url_for('main.login') }}" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" id="email" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" id="password" required minlength="6"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none">
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">Sign In</button>
    </form>
    <div class="mt-4 pt-4 border-t border-gray-200">
      <p class="text-sm text-gray-500 text-center mb-3">Don't have an account?</p>
      <form method="POST" action="{{ url_for('main.signup') }}" class="space-y-4">
        <input type="email" name="email" placeholder="Email" required
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none">
        <input type="password" name="password" placeholder="Password (min 6 chars)" required minlength="6"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none">
        <button type="submit" class="w-full bg-gray-800 text-white py-2 rounded-lg font-medium hover:bg-gray-900 transition">Create Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
